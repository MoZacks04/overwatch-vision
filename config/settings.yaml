capture:
  window_title_contains: "Overwatch"
  fallback_monitor_index: 1
  target_fps: 30

performance:
  # The preview/capture loop stays at 30 FPS, but expensive analysis does
  # not need to run on every captured frame.
  killfeed_every_n_frames: 3
  team_status_every_n_frames: 15
  parser_results_per_frame: 8

killfeed:
  search_region:
    left: 0.60
    top: 0.060
    right: 0.995
    bottom: 0.220

  color_panels:
    red:
      hue_low_1: 168
      hue_high_1: 179
      hue_low_2: 0
      hue_high_2: 6
      min_saturation: 100
      min_value: 85
    blue:
      hue_low: 94
      hue_high: 103
      min_saturation: 105
      min_value: 90

  min_panel_area_fraction: 0.0015
  max_panel_area_fraction: 0.14
  min_panel_width_fraction: 0.055
  min_panel_height_fraction: 0.08
  max_panel_height_fraction: 0.42
  min_panel_aspect_ratio: 1.55
  min_panel_fill_ratio: 0.50

  row_group_y_tolerance_fraction: 0.11
  min_components_per_row: 2
  min_row_width_fraction: 0.22
  max_right_gap_fraction: 0.20

  normalized_row_width: 640
  normalized_row_height: 72

killfeed_parse:
  friendly_team: "blue"

  save_low_confidence_crops: true
  low_confidence_threshold: 0.58
  review_directory: "debug_frames/killfeed_review"

team_status:
  enabled: true

  search_region:
    left: 0.80
    top: 0.005
    right: 0.995
    bottom: 0.085

  max_players: 6

  # The digit matcher only reruns when this small HUD crop actually changes.
  change_threshold: 0.020
  min_confidence: 0.30

ocr:
  enabled: true
  languages:
    - "en"
  gpu: false

  # EasyOCR is only used for player names. Limiting PyTorch threads stops
  # occasional OCR jobs from monopolizing the CPU.
  cpu_threads: 2

hero_recognition:
  enabled: true
  heroes_api_url: "https://overfast-api.tekrop.fr/heroes"
  cache_directory: ".cache/hero_portraits"
  refresh_hours: 24
  min_confidence: 0.46

tracking:
  confirmation_frames: 3
  missing_frames_before_expire: 18
  max_vertical_shift_fraction: 0.18
  fingerprint_size: 16
  fingerprint_match_threshold: 0.78

audio:
  enabled: true
  phrase: "Elimination detected"
  rate: 190
  volume: 1.0
  speak_startup_test: true
  speak_player_names: false
  suppress_first_seconds: 2.0

debug:
  enabled: true

  show_full_view: true
  full_view_scale: 0.55

  show_killfeed_monitor: true
  killfeed_monitor_scale: 1.50

  draw_search_region: true
  draw_team_status_region: true
  draw_rows: true
  show_event_banner_seconds: 2.25
