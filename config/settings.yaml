capture:
  window_title_contains: "Overwatch"
  fallback_monitor_index: 1
  target_fps: 30

killfeed:
  # The kill feed sits below the small team-status counter. Starting the
  # search slightly lower prevents the 4-v-4 status widget being mistaken
  # for an elimination row.
  search_region:
    left: 0.60
    top: 0.060
    right: 0.995
    bottom: 0.220

  # Default Overwatch team-nameplate colors. These are deliberately narrow
  # so saturated map geometry is not treated as HUD.
  color_panels:
    red:
      hue_low_1: 168
      hue_high_1: 179
      hue_low_2: 0
      hue_high_2: 6
      min_saturation: 100
      min_value: 85
    blue:
      hue_low: 94
      hue_high: 103
      min_saturation: 105
      min_value: 90

  min_panel_area_fraction: 0.0015
  max_panel_area_fraction: 0.14
  min_panel_width_fraction: 0.055
  min_panel_height_fraction: 0.08
  max_panel_height_fraction: 0.42
  min_panel_aspect_ratio: 1.55
  min_panel_fill_ratio: 0.50

  row_group_y_tolerance_fraction: 0.11
  min_components_per_row: 2
  min_row_width_fraction: 0.22
  max_right_gap_fraction: 0.20

  normalized_row_width: 640
  normalized_row_height: 72

team_status:
  # Separate region for the small team-count/status widget above the feed.
  # It is intentionally tracked separately from eliminations.
  search_region:
    left: 0.855
    top: 0.010
    right: 0.985
    bottom: 0.075

tracking:
  confirmation_frames: 3
  missing_frames_before_expire: 18
  max_vertical_shift_fraction: 0.18
  fingerprint_size: 16
  fingerprint_match_threshold: 0.78

audio:
  enabled: true
  phrase: "Elimination detected"
  rate: 190
  volume: 0.90
  suppress_first_seconds: 2.0

debug:
  enabled: true

  show_full_view: true
  full_view_scale: 0.55

  show_killfeed_monitor: true
  killfeed_monitor_scale: 1.50

  draw_search_region: true
  draw_team_status_region: true
  draw_rows: true
  show_event_banner_seconds: 1.25
