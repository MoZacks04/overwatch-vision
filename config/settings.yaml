capture:
  window_title_contains: "Overwatch"
  fallback_monitor_index: 1
  target_fps: 30

performance:
  # The preview/capture loop stays at 30 FPS, but expensive analysis does
  # not need to run on every captured frame.
  killfeed_every_n_frames: 2
  team_status_every_n_frames: 15
  parser_results_per_frame: 8

killfeed:
  # Keep the ROI broad enough to include long and deeply stacked feed rows.
  # The learned verifier now handles the extra background, so proposal recall
  # is more important than keeping this search window extremely tight.
  search_region:
    left: 0.64
    top: 0.035
    right: 0.995
    bottom: 0.285

  color_panels:
    red:
      hue_low_1: 165
      hue_high_1: 179
      hue_low_2: 0
      hue_high_2: 10
      min_saturation: 80
      min_value: 70
    blue:
      hue_low: 88
      hue_high: 110
      min_saturation: 80
      min_value: 70

  # First-stage panel rules are intentionally permissive. The learned row
  # verifier is the second-stage filter, so this detector should prefer
  # proposing a questionable row over dropping a real feed entry.
  min_panel_area_fraction: 0.0010
  max_panel_area_fraction: 0.10
  min_panel_width_fraction: 0.040
  max_panel_width_fraction: 0.48
  min_panel_height_fraction: 0.065
  max_panel_height_fraction: 0.31
  min_panel_aspect_ratio: 1.20
  max_panel_aspect_ratio: 10.0
  min_panel_fill_ratio: 0.42
  panel_close_width_fraction: 0.010
  panel_scan_left_fraction: 0.06

  # Opposite-color panel pairing remains a useful proposal heuristic, but
  # these geometry gates are deliberately broad for recall.
  pair_min_height_ratio: 0.58
  pair_max_center_y_delta_rows: 0.55
  pair_min_vertical_overlap: 0.48
  pair_min_gap_rows: -0.40
  pair_max_gap_rows: 3.80
  min_pair_score: 0.42

  min_row_left_fraction: 0.08
  min_row_width_fraction: 0.16
  max_row_width_fraction: 0.86
  max_right_gap_fraction: 0.24
  row_padding_x_rows: 0.05
  row_padding_y_rows: 0.06
  row_suppression_center_distance_rows: 0.50

  normalized_row_width: 640
  normalized_row_height: 72

killfeed_parse:
  # User-confirmed team convention for this setup.
  friendly_team: "blue"
  local_player_name: "MONKEYMAIN"
  local_player_name_match_threshold: 0.82

  # Hero portrait boxes are anchored to the inner edge of the two selected
  # nameplates. These exact rectangles are also the yellow K/V debug boxes.
  hero_icon_size_rows: 1.08
  hero_inner_edge_offset_rows: 0.04

  # After the geometric square is predicted, search only a few pixels around
  # it for the most portrait-like patch. This fixes mask-edge drift without
  # letting the box jump to the action icon.
  refine_hero_boxes: true
  hero_refine_search_x_rows: 0.24
  hero_refine_search_y_rows: 0.10
  hero_refine_step_rows: 0.06

  # Hero identity is accepted only after the same prediction wins across
  # several consecutive snapshots of the SAME tracked kill-feed row.
  hero_consensus_frames: 5
  hero_consensus_min_votes: 3
  hero_consensus_min_fraction: 0.60
  hero_consensus_min_average_confidence: 0.78

  # Do not accept arbitrary OCR guesses for player handles.
  min_name_confidence: 0.55

  save_low_confidence_crops: true
  low_confidence_threshold: 0.58
  review_directory: "debug_frames/killfeed_review"

  # Save the exact killer/victim portrait crops from every parsed event so
  # we can build a kill-feed-specific hero reference bank.
  capture_hero_samples: true
  hero_sample_directory: "debug_frames/hero_samples"

team_status:
  enabled: true

  search_region:
    left: 0.80
    top: 0.005
    right: 0.995
    bottom: 0.085

  max_players: 6

  # The digit matcher only reruns when this small HUD crop actually changes.
  change_threshold: 0.020
  min_confidence: 0.30

ocr:
  enabled: true
  languages:
    - "en"
  gpu: false

  # EasyOCR is only used for player names. Limiting PyTorch threads stops
  # occasional OCR jobs from monopolizing the CPU.
  cpu_threads: 2

killfeed_localizer:
  # Optional learned FIRST-STAGE detector over the full kill-feed ROI.
  # Until models/killfeed_row_localizer.pt exists, runtime behavior is
  # unchanged and the legacy color/geometry detector remains the only source.
  enabled: true
  model_path: "models/killfeed_row_localizer.pt"

  # Low threshold on purpose: localization should favor recall. The tracker
  # and downstream parsing can reject unstable detections later.
  min_confidence: 0.20
  iou_threshold: 0.45
  imgsz: 416
  max_det: 8

killfeed_row_verifier:
  # Optional learned second-stage filter. Until the model files exist, this
  # changes nothing and every geometry/color proposal passes through.
  enabled: true
  model_path: "models/killfeed_row_verifier.pt"
  labels_path: "models/killfeed_row_verifier_labels.json"
  input_width: 256
  input_height: 64

  # Keep the learned verifier near a neutral decision threshold. The proposal
  # stage is intentionally permissive, so the verifier removes obvious junk
  # without sacrificing too many real rows.
  min_real_probability: 0.50

hero_classifier:
  # Once train_hero_classifier.py creates these files, the runtime prefers
  # this kill-feed-specific CNN over generic portrait similarity.
  enabled: true
  model_path: "models/killfeed_hero_classifier.pt"
  labels_path: "models/killfeed_hero_classifier_labels.json"
  input_size: 64

  # Be conservative: an uncertain classifier result becomes "unknown" rather
  # than a confidently wrong spoken hero name.
  min_confidence: 0.86
  min_margin: 0.14

hero_recognition:
  enabled: true
  heroes_api_url: "https://overfast-api.tekrop.fr/heroes"
  cache_directory: ".cache/hero_portraits"
  refresh_hours: 24

  # Hero names are only spoken when the match is both strong and clearly
  # better than the runner-up. False negatives are preferable to false calls.
  min_confidence: 0.82
  min_margin: 0.10
  min_gray_stddev: 16.0
  debug_rejections: true

  # Exact in-game kill-feed crops labeled with label_hero_samples.py are
  # preferred over the generic downloaded portrait references.
  local_template_directory: ".cache/killfeed_hero_templates"
  local_min_confidence: 0.78
  local_min_margin: 0.06

tracking:
  # Favor recall: three confirmations at ~15 Hz is enough to stabilize a row
  # without requiring an intermittently detected entry to survive for 0.5 s.
  confirmation_frames: 3
  history_frames: 6
  missing_frames_before_expire: 18
  max_vertical_shift_fraction: 0.24
  fingerprint_size: 16
  fingerprint_match_threshold: 0.75

  # If an animated/fading row temporarily loses its track and is recreated,
  # suppress the second emission for a short period.
  dedupe_seconds: 2.25
  dedupe_similarity: 0.90

event_dedupe:
  # Final duplicate guard after names/heroes are parsed. Same player pair or
  # hero pair will only be announced once inside this window. If identity is
  # still unknown, the row's visual fingerprint is used as a fallback.
  window_seconds: 10.0
  visual_similarity: 0.86

audio:
  enabled: true
  phrase: "Elimination detected"
  rate: 190
  volume: 1.0
  speak_startup_test: true
  speak_player_names: false
  suppress_first_seconds: 2.0

debug:
  enabled: true

  show_full_view: true
  full_view_scale: 0.55

  show_killfeed_monitor: true
  killfeed_monitor_scale: 1.50

  draw_search_region: true
  draw_team_status_region: true
  draw_rows: true

  # Yellow K/V boxes now show the exact rectangles passed to hero recognition
  # and remain visible from confirmed tracks between detector updates.
  draw_hero_icon_boxes: true
  show_event_banner_seconds: 2.25
