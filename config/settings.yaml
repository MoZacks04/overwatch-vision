capture:
  window_title_contains: "Overwatch"
  fallback_monitor_index: 1
  target_fps: 30

killfeed:
  search_region:
    left: 0.60
    top: 0.060
    right: 0.995
    bottom: 0.220

  color_panels:
    red:
      hue_low_1: 168
      hue_high_1: 179
      hue_low_2: 0
      hue_high_2: 6
      min_saturation: 100
      min_value: 85
    blue:
      hue_low: 94
      hue_high: 103
      min_saturation: 105
      min_value: 90

  min_panel_area_fraction: 0.0015
  max_panel_area_fraction: 0.14
  min_panel_width_fraction: 0.055
  min_panel_height_fraction: 0.08
  max_panel_height_fraction: 0.42
  min_panel_aspect_ratio: 1.55
  min_panel_fill_ratio: 0.50

  row_group_y_tolerance_fraction: 0.11
  min_components_per_row: 2
  min_row_width_fraction: 0.22
  max_right_gap_fraction: 0.20

  normalized_row_width: 640
  normalized_row_height: 72

killfeed_parse:
  # Default first-person Overwatch colors: blue = friendly, red = enemy.
  friendly_team: "blue"

  # Low-confidence rows are saved locally so we can improve recognition
  # without recording the full game frame.
  save_low_confidence_crops: true
  low_confidence_threshold: 0.58
  review_directory: "debug_frames/killfeed_review"

team_status:
  enabled: true

  # Wider than the exact 4 VS 4 widget so HUD scale changes still fit.
  search_region:
    left: 0.80
    top: 0.005
    right: 0.995
    bottom: 0.085

  read_interval_seconds: 0.40
  max_players: 6

ocr:
  enabled: true
  languages:
    - "en"
  gpu: false

hero_recognition:
  enabled: true
  heroes_api_url: "https://overfast-api.tekrop.fr/heroes"
  cache_directory: ".cache/hero_portraits"
  refresh_hours: 24
  min_confidence: 0.46

tracking:
  confirmation_frames: 3
  missing_frames_before_expire: 18
  max_vertical_shift_fraction: 0.18
  fingerprint_size: 16
  fingerprint_match_threshold: 0.78

audio:
  enabled: true
  phrase: "Elimination detected"
  rate: 190
  volume: 1.0

  # Says a short phrase as soon as the app starts so audio can be verified.
  speak_startup_test: true

  # Player handles are still printed to the terminal. Set this true if you
  # also want handles spoken aloud.
  speak_player_names: false

  suppress_first_seconds: 2.0

debug:
  enabled: true

  show_full_view: true
  full_view_scale: 0.55

  show_killfeed_monitor: true
  killfeed_monitor_scale: 1.50

  draw_search_region: true
  draw_team_status_region: true
  draw_rows: true
  show_event_banner_seconds: 2.25
